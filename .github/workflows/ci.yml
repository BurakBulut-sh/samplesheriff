name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check src tests

      - name: Run ruff format check
        run: ruff format --check src tests

      - name: Run mypy
        run: mypy src

      - name: Run tests with pytest
        run: pytest --cov=samplesheriff --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Test CLI help
        run: |
          samplesheriff --version
          samplesheriff --help
          samplesheriff validate --help
          samplesheriff schema --help

      - name: Test schema commands
        run: |
          samplesheriff schema list
          samplesheriff schema show nfcore_like
          samplesheriff schema show minimal

      - name: Test init command
        run: |
          samplesheriff init /tmp/test_init --type fastq --name test
          cat /tmp/test_init/test.tsv
          samplesheriff validate -i /tmp/test_init/test.tsv -s /tmp/test_init/test_schema.yaml

      - name: Test example validations
        run: |
          # Valid examples should pass
          samplesheriff validate -i examples/valid_paired_fastq.tsv -s builtin:nfcore_like
          samplesheriff validate -i examples/valid_single_end.tsv -s builtin:nfcore_like
          
          # Invalid examples should fail
          samplesheriff validate -i examples/invalid_missing_column.tsv -s builtin:nfcore_like && exit 1 || true
          samplesheriff validate -i examples/invalid_empty_required.tsv -s builtin:nfcore_like && exit 1 || true

      - name: Test JSON output
        run: |
          samplesheriff validate -i examples/valid_paired_fastq.tsv -s builtin:nfcore_like --format json

      - name: Test report generation
        run: |
          samplesheriff validate -i examples/valid_paired_fastq.tsv -s builtin:nfcore_like --report /tmp/report.json
          cat /tmp/report.json

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: samplesheriff:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm samplesheriff:test --version
          docker run --rm samplesheriff:test --help
