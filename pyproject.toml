[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samplesheriff"
version = "0.1.0"
description = "A fast, strict, nf-core-style sample sheet and metadata validator for bioinformatics pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Burak Bulut, Ph.D.", email = "burak.buluut@outlook.com" },
]
keywords = [
    "bioinformatics",
    "samplesheet",
    "validation",
    "nf-core",
    "FASTQ",
    "BAM",
    "VCF",
    "pipeline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-yaml>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]
pysam = [
    "pysam>=0.22.0",
]
all = [
    "samplesheriff[dev,pysam]",
]

[project.scripts]
samplesheriff = "samplesheriff.cli:main"

[project.urls]
Homepage = "https://github.com/BurakBulut-sh/samplesheriff"
Repository = "https://github.com/BurakBulut-sh/samplesheriff"
Documentation = "https://github.com/BurakBulut-sh/samplesheriff#readme"
Issues = "https://github.com/BurakBulut-sh/samplesheriff/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/samplesheriff"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.isort]
known-first-party = ["samplesheriff"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--cov=samplesheriff",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src/samplesheriff"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
